name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # release.yml runs the same gate before building

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Chrome for Testing: stable Chrome ignores --load-extension, which the DOM Invader test needs.
      # ponytail: not on macOS, where CfT's cold start on the runner exceeds the 25s render timeout (test self-skips)
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        if: runner.os != 'macOS'
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: cargo test --workspace --locked
        env:
          BURPCRAFT_CHROME: ${{ steps.chrome.outputs.chrome-path }}

  e2e:
    name: End-to-end (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the app is a GUI: a virtual X display plus Mesa's software Vulkan/GL for wgpu
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libegl1 libgl1 libxkbcommon-x11-0
      - run: cargo build --locked
      - name: Proxy e2e (e2e.py)
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          xvfb-run -a target/debug/burpcraft > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 100); do nc -z 127.0.0.1 8080 && break; sleep 0.3; done
          python3 e2e.py
          pkill -f target/debug/burpcraft || true
      # own ports, so a leftover app from the step above can never answer in its place
      - name: Scanner / REST / MCP e2e (e2e_scan.py)
        run: xvfb-run -a python3 e2e_scan.py --launch target/debug/burpcraft
        env: { E2E_PROXY: "18080", E2E_API: "11337", E2E_MCP: "11338" }
      - if: failure()
        run: cat "$RUNNER_TEMP/app.log" || true

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95" # keep in sync with rust-version (egui 0.37 needs 1.95)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      # a ratchet: raise the floor when coverage grows, never lower it (egui UI code is untested by design)
      - run: cargo llvm-cov --workspace --locked --summary-only --fail-under-lines 55

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      # advisories (RustSec), licenses, banned crates and crate sources; policy in deny.toml
      - run: cargo deny --locked check

  # single required check for branch protection, so the matrix can change freely
  ci-ok:
    name: CI OK
    if: always()
    needs: [fmt, clippy, test, e2e, msrv, coverage, audit]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
