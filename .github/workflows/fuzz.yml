name: Fuzz

# the parser fuzz tests (src/fuzz.rs) at length; every PR runs them briefly via cargo test
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Parser fuzz (long)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # release for speed, overflow checks on so wrapping arithmetic still panics
      - run: cargo test --release --locked "fuzz::"
        env:
          BURPCRAFT_FUZZ_ITERS: "2000000"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
