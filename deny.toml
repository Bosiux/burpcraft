# cargo deny check: known vulnerabilities, licenses, duplicate/banned crates, crate sources

[advisories]
yanked = "deny"
ignore = [
    # unmaintained (not vulnerable) zbus crates, Linux only, pulled by eframe's accesskit screen-reader
    # bridge (accesskit_unix -> atspi); drop when eframe moves off them
    { id = "RUSTSEC-2026-0370", reason = "zvariant: transitive via eframe accesskit on Linux, no fix upstream" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: transitive via eframe accesskit on Linux, no fix upstream" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: transitive via eframe accesskit on Linux, no fix upstream" },
]

[licenses]
# everything in Cargo.lock today; a new license needs a deliberate edit here
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# the workspace `path` dependency on burpcraft-server; both crates are publish = false
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
