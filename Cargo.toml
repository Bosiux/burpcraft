[package]
name = "burpcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
burpcraft-server = { path = "server" }
bytes = "1"
chrono = "0.4.45"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "clipboard"] }
ego-tree = "0.11"
egui_extras = "0.37"
flate2 = "1"
h2 = "0.4"
http = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
md5 = "0.7"
rcgen = "0.14"
regex = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = "0.29.0"
tokio = { version = "1", features = ["rt", "net", "time"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
yaml-rust2 = { version = "0.13", default-features = false }

# eframe has no windowing backend on Linux without these
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }

# native menu bar at the top of the screen (Windows/Linux keep the in-window egui one)
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }

[workspace]
members = ["server"]

[lints.clippy]
type_complexity = "allow"
nonminimal_bool = "allow"
