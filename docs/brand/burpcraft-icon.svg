<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>BurpCraft icon: a request arrow caught in a target reticle on an orange tile</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#d9480f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#gloss)"/>
  <!-- traffic lines -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="86" x2="84" y2="86"/>
    <line x1="40" y1="170" x2="84" y2="170"/>
  </g>
  <!-- reticle -->
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round">
    <circle cx="140" cy="128" r="62"/>
    <line x1="140" y1="52" x2="140" y2="80"/>
    <line x1="140" y1="176" x2="140" y2="204"/>
    <line x1="216" y1="128" x2="188" y2="128"/>
  </g>
  <!-- intercepted request -->
  <path d="M40 128 H128" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <path d="M112 104 L144 128 L112 152 Z" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="140" cy="128" r="9" fill="#7a2a06"/>
</svg>
